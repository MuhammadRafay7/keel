name: Deploy Supabase

# The database and the Edge Functions ship with the code that depends on them.
# Without this, a merge deploys a frontend that calls RPCs the live project does
# not have, which is the state the project was in before this workflow existed.
#
# Runs only when something under supabase/ actually changed, so an ordinary
# frontend merge does not touch the database.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Also deploy the Edge Functions"
        required: false
        type: boolean
        default: true

# Two runs applying migrations at once would race on the same database.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what will be applied
        run: supabase migration list --linked

      # Every migration in this repository is written to be re-runnable, so a
      # re-applied file is a no-op rather than a failure. That is what makes an
      # automatic push safe; keep it true for anything added later.
      - name: Apply migrations
        run: supabase db push --include-all

      - name: Deploy Edge Functions
        if: github.event_name == 'push' || inputs.deploy_functions
        run: |
          supabase functions deploy send-workspace-invite --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy send-notification-email --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-proxy --project-ref "$SUPABASE_PROJECT_REF"

      # The email triggers dispatch through pg_net, which reads the target URL
      # and key from database settings. Unset, they fall back to localhost and
      # every send silently goes nowhere — no error raised, no email sent — so
      # this is applied on every deploy rather than set once by hand.
      #
      # Runs after the functions deploy on purpose: if this step fails, the
      # rest of the deploy has already landed, and the only thing missing is
      # the email dispatch it configures.
      #
      # The anon key is read from the project rather than a secret, because
      # SUPABASE_ACCESS_TOKEN is already here and one fewer secret to rotate is
      # one fewer way for this to quietly stop working.
      - name: Point the email triggers at this project
        run: |
          # -o and --output have swapped between CLI versions; try both
          # rather than pin a version this workflow does not otherwise care
          # about.
          KEYS_JSON="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json 2>/dev/null \
            || supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json 2>/dev/null \
            || echo '')"

          ANON_KEY="$(printf '%s' "$KEYS_JSON" | jq -r '.[]? | select(.name == "anon") | .api_key' 2>/dev/null | head -1)"

          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "Could not read the anon key for $SUPABASE_PROJECT_REF." >&2
            echo "The email triggers will keep dispatching to localhost until this is fixed." >&2
            exit 1
          fi

          # Written as a row rather than a database setting. ALTER DATABASE
          # ... SET is refused on Supabase — the postgres role is not a
          # superuser — so 0018 moved these into public.app_settings, which
          # ordinary DML can reach. Sent over the Management API because a
          # direct connection from CI has to survive a password that may break
          # a connection URI and a hostname that is either region-dependent or
          # IPv6-only.
          SQL="insert into public.app_settings (key, value, updated_at) values"
          SQL="$SQL ('supabase_url', 'https://$SUPABASE_PROJECT_REF.supabase.co', now()),"
          SQL="$SQL ('supabase_anon_key', '$ANON_KEY', now())"
          SQL="$SQL on conflict (key) do update set value = excluded.value, updated_at = now();"

          # jq handles the JSON escaping; the key is a JWT, so it carries
          # nothing that would break out of the SQL string literal.
          PAYLOAD="$(jq -n --arg q "$SQL" '{query: $q}')"

          HTTP_CODE="$(curl -sS -o /tmp/settings-response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")"

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Setting the email dispatch target failed with HTTP $HTTP_CODE:" >&2
            cat /tmp/settings-response.json >&2
            exit 1
          fi

          echo "Email triggers now dispatch to https://$SUPABASE_PROJECT_REF.supabase.co"

      # Optional. Without it, 0019 generates a secret on first use and stores
      # it in app_settings, which works but leaves the key material in the
      # same database as the ciphertext. Setting this seeds an
      # externally-held secret instead.
      #
      # Written with ON CONFLICT DO NOTHING on purpose: once any key has been
      # encrypted, replacing the secret makes every stored key undecryptable.
      # Rotating is therefore a deliberate manual operation, not something a
      # deploy can do by accident.
      - name: Seed the AI key encryption secret
        if: ${{ secrets.SUPABASE_AI_ENCRYPTION_SECRET != '' }}
        env:
          AI_ENCRYPTION_SECRET: ${{ secrets.SUPABASE_AI_ENCRYPTION_SECRET }}
        run: |
          SQL="insert into public.app_settings (key, value, updated_at)"
          SQL="$SQL values ('ai_encryption_secret', \$secret\$$AI_ENCRYPTION_SECRET\$secret\$, now())"
          SQL="$SQL on conflict (key) do nothing;"

          PAYLOAD="$(jq -n --arg q "$SQL" '{query: $q}')"

          HTTP_CODE="$(curl -sS -o /tmp/ai-secret-response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")"

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Seeding the AI encryption secret failed with HTTP $HTTP_CODE:" >&2
            cat /tmp/ai-secret-response.json >&2
            exit 1
          fi

          echo "AI key encryption secret is provisioned."

      - name: Confirm the migration history matches the repository
        run: supabase migration list --linked
